[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbofan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml",
    "scikit-learn",
    "joblib",
    "torch",
    "mlflow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "mypy",
    "types-pyyaml",
    "pandas-stubs",
    "kaggle",
    "nbstripout",
    "nbformat",
    "jupyter",
    "scipy",
]

[project.scripts]
turbofan-download-data = "turbofan.cli.download_data:main"
turbofan-train-baseline = "turbofan.cli.train_baseline:main"
turbofan-train-sequence = "turbofan.cli.train_sequence:main"
turbofan-train-sequence-gru = "turbofan.cli.train_sequence_gru:main"
turbofan-predict = "turbofan.cli.predict:main"
turbofan-serve-api = "turbofan.cli.serve_api:main"
turbofan-promote = "turbofan.cli.promote_model:main"
turbofan-models = "turbofan.cli.list_models:main"
turbofan-feature-screen = "turbofan.cli.run_feature_screen:main"
turbofan-export-eval = "turbofan.cli.export_official_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "BLE", "ARG", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "joblib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --basetemp=.pytest_tmp --cov=turbofan --cov-report=term-missing"

[tool.coverage.run]
source = ["turbofan"]

[tool.coverage.report]
show_missing = true
fail_under = 93
