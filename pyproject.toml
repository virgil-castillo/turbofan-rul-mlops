[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbofan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml",
    "scikit-learn",
    "joblib",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-pyyaml",
    "pandas-stubs",
    "kaggle",
    "nbstripout",
    "nbformat",
    "jupyter",
    "scipy",
]

[project.scripts]
turbofan-download-data = "turbofan.cli.download_data:main"
turbofan-train-baseline = "turbofan.cli.train_baseline:main"
turbofan-train-sequence-gru = "turbofan.cli.train_sequence_gru:main"
turbofan-predict = "turbofan.cli.predict:main"
turbofan-serve-api = "turbofan.cli.serve_api:main"
turbofan-sweep-baseline-alpha = "turbofan.experiments.baseline_alpha:main"
turbofan-compare-baseline-features = "turbofan.experiments.baseline_feature_comparison:main"
turbofan-sweep-gru = "turbofan.experiments.sequence_gru_sweep:main"
turbofan-sweep-feature-gru = "turbofan.experiments.feature_gru_sweep:main"
turbofan-sweep-features = "turbofan.experiments.feature_sweep:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "joblib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
