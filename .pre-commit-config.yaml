repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/
        require_serial: true
      - id: mypy
        name: mypy (strict)
        entry: mypy src/turbofan
        language: system
        types: [python]
        pass_filenames: false
      - id: nbstripout
        name: nbstripout
        entry: nbstripout
        language: system
        files: \.ipynb$
