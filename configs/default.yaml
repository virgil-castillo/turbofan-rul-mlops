project_name: turbofan-rul-mlops

data:
  raw_dir: data/raw
  processed_dir: data/processed
  interim_dir: data/interim
  fd_subset: FD001
  max_rul: 125
  test_size: 0.2
  random_seed: 42

features:
  sensor_cols_to_drop: []

model:
  name: ridge
  alpha: 100.0
  feature_set: rolling
  windows:
    - 10
  artifact_dir: artifacts/models

sequence:
  architecture: gru
  window_size: 45
  batch_size: 64
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
  learning_rate: 0.001
  epochs: 50
  patience: 8
  device: cpu
  artifact_dir: artifacts/models

inference:
  artifact_path: null
  host: 0.0.0.0
  port: 8000
  allow_partial: false
