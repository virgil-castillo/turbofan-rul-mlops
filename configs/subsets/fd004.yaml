_base_: ../default.yaml

data:
  fd_subset: FD004

features:
  # Zero-variance after per-mode normalization: s_1, s_5, s_18, s_19
  # Failed correlation filter post-normalization (|r| < 0.1): s_15, s_20, s_21
  # s_16 is binary (0.02/0.03) but passes correlation — kept, treat with caution
  sensor_cols_to_drop:
    - s_1
    - s_5
    - s_15
    - s_18
    - s_19
    - s_20
    - s_21
  n_modes: 6
  # Best-config feature engineering per model (from the feature sweep).
  ridge:
    feature_set: raw_plus_rolling_mean
    windows: [8]
  gru:
    feature_set: raw_plus_rolling_mean
    windows: [10]
