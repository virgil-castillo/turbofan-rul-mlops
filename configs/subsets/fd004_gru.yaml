# GRU variant of the FD004 subset config. Inherits every data, feature, and
# sequence setting from fd004.yaml and sets the architecture explicitly to GRU,
# so GRU and LSTM training for FD004 are both selected by an explicit, named,
# version-controlled config. The shared SequenceConfig hyperparameters apply
# unchanged; GRU resolves its feature settings from the `features.gru` block in
# the base config.
_base_: fd004.yaml

sequence:
  architecture: gru
