# LSTM variant of the FD002 subset config. Inherits every data, feature, and
# sequence settings from fd002.yaml, flips the architecture to LSTM, and applies
# the LSTM-selected sequence window from the feature-family screen. Feature
# settings resolve from the `features.lstm` block in the base config.
_base_: fd002.yaml

sequence:
  architecture: lstm
  window_size: 30
