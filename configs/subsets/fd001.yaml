_base_: ../default.yaml

data:
  fd_subset: FD001

features:
  # Constant: s_1, s_10, s_18, s_19
  # Failed correlation filter (|r| < 0.1): s_5, s_16
  sensor_cols_to_drop:
    - s_1
    - s_5
    - s_10
    - s_16
    - s_18
    - s_19
  n_modes: 1
  # Best-config feature engineering per model (from the feature sweep).
  ridge:
    feature_set: raw_plus_rolling_mean
    windows: [2]
  gru:
    feature_set: rolling_mean
    windows: [15]
