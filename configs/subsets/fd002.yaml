_base_: ../default.yaml

data:
  fd_subset: FD002

features:
  # Zero-variance after per-mode normalization: s_1, s_5, s_18, s_19
  # Failed correlation filter post-normalization (|r| < 0.1): s_10
  # s_16 is binary (0.02/0.03) but passes correlation — kept, treat with caution
  sensor_cols_to_drop:
    - s_1
    - s_5
    - s_10
    - s_18
    - s_19
  n_modes: 6
  # Model feature settings from the latest Ridge sweep and sequence
  # feature-family screen.
  ridge:
    feature_families: [raw, rolling_mean]
    windows: [4]
  gru:
    feature_families: [raw, rolling_slope]
    windows: [20]
  lstm:
    feature_families: [raw, rolling_slope]
    windows: [20]

# GRU sequence hyperparameters from the sequence feature-family screen.
# device inherits `cpu` from default.yaml.
sequence:
  window_size: 60
  hidden_size: 64
  learning_rate: 0.001
