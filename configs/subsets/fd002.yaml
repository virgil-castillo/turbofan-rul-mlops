_base_: ../default.yaml

data:
  fd_subset: FD002

features:
  # Zero-variance after per-mode normalization: s_1, s_5, s_18, s_19
  # Failed correlation filter post-normalization (|r| < 0.1): s_10
  # s_16 is binary (0.02/0.03) but passes correlation — kept, treat with caution
  sensor_cols_to_drop:
    - s_1
    - s_5
    - s_10
    - s_18
    - s_19
  n_modes: 6
  # Ridge: best-config feature engineering from the feature sweep.
  # GRU: selected config from the Stage 2 capacity sweep (docs/gru_capacity_sweep_report.md).
  ridge:
    feature_set: raw_plus_rolling_mean
    windows: [4]
  gru:
    feature_set: rolling_mean
    windows: [10]
  # LSTM: seeded from the GRU-tuned values; a dedicated LSTM feature sweep is a
  # possible follow-up and may diverge these from GRU.
  lstm:
    feature_set: rolling_mean
    windows: [10]

# GRU sequence hyperparameters selected by the Stage 2 capacity sweep.
# device inherits `cpu` from default.yaml.
sequence:
  window_size: 60
  hidden_size: 64
  learning_rate: 0.001
