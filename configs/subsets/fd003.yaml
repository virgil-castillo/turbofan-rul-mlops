_base_: ../default.yaml

data:
  fd_subset: FD003

features:
  # Constant: s_1, s_18, s_19
  # Failed correlation filter (|r| < 0.1): s_5, s_6, s_15, s_16, s_20, s_21
  # s_10 kept — low std but r=-0.49 with RUL (real signal)
  sensor_cols_to_drop:
    - s_1
    - s_5
    - s_6
    - s_15
    - s_16
    - s_18
    - s_19
    - s_20
    - s_21
  n_modes: 1
  # Ridge: best-config feature engineering from the feature sweep.
  # GRU: selected config from the Stage 2 capacity sweep (docs/gru_capacity_sweep_report.md).
  ridge:
    feature_set: raw_plus_rolling_mean
    windows: [4]
  gru:
    feature_set: raw
    windows: []

# GRU sequence hyperparameters selected by the Stage 2 capacity sweep.
# device inherits `cpu` from default.yaml.
sequence:
  window_size: 60
  hidden_size: 64
  learning_rate: 0.001
