_base_: ../default.yaml

data:
  fd_subset: FD003

features:
  # Constant: s_1, s_18, s_19
  # Failed correlation filter (|r| < 0.1): s_5, s_6, s_15, s_16, s_20, s_21
  # s_10 kept — low std but r=-0.49 with RUL (real signal)
  sensor_cols_to_drop:
    - s_1
    - s_5
    - s_6
    - s_15
    - s_16
    - s_18
    - s_19
    - s_20
    - s_21
  n_modes: 1
  # Model feature settings from the latest Ridge sweep and sequence
  # feature-family screen.
  ridge:
    feature_families: [raw, rolling_mean]
    windows: [4]
  gru:
    feature_families: [raw]
    windows: []
  lstm:
    feature_families: [raw, rolling_delta]
    windows: [20]

# Sequence hyperparameters from the sequence feature-family screen.
# device inherits `cpu` from default.yaml.
sequence:
  window_size: 60
  hidden_size: 64
  learning_rate: 0.001
